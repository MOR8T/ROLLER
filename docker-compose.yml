# Prod-like base: no bind mounts, no --reload, Next.js standalone build.
# `docker compose up` also picks up docker-compose.override.yml (dev
# overrides) automatically — run `docker compose -f docker-compose.yml up`
# alone for a prod-only stack.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      # Must match the frontend's copy below — see .env.example.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY}
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000
      # Server-to-server calls use the line above (Docker's internal DNS,
      # unreachable from a browser). This one is what browser <img> src
      # attributes get built from, so it has to resolve from *outside* the
      # compose network. `localhost:8000` only works because
      # docker-compose.override.yml publishes the backend on the host — a
      # real deployment needs a real public backend URL (reverse proxy or
      # domain) and must set this explicitly once one exists.
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8000}
      # Reads the maintenance preview code off the backend. Same value as the
      # backend's; unset on either side means preview access is off.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    ports:
      - "3031:3031"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
