# Reverse proxy for the ROLLER.TJ stack.
#
# One origin for everything — the site, /api and /uploads all come off the same
# host — which is what keeps the browser from ever making a cross-origin
# request, and why the backend's CORS list can stay essentially empty.
#
# TLS is a self-signed certificate for now (the roller.tj domain isn't ours
# yet), so browsers will warn. It is here rather than plain HTTP only because
# the admin panel posts a password: without it that password crosses the
# network in clear text. Swapping in Let's Encrypt later means replacing the
# two ssl_certificate lines and enabling the redirect in the :80 block.


map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt's HTTP-01 challenge lands here once a domain exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Once a real certificate is in place, replace everything below with:
    #     return 301 https://$host$request_uri;
    include /etc/nginx/conf.d/app-locations.inc;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/app-locations.inc;
}
