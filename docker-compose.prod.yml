# Production stack. Run it explicitly and on its own:
#
#     docker compose -f docker-compose.prod.yml up -d
#
# Never plain `docker compose up` here — that would also pull in
# docker-compose.override.yml, which bind-mounts source, enables --reload and
# publishes Postgres and the backend on the host.
#
# Images are built by GitHub Actions and pulled from the registry; nothing is
# built on the server. `next build` peaks well above this box's 4 GB of RAM.
#
# Both IMAGE_TAG and PUBLIC_ORIGIN are required rather than defaulted. A
# default of `latest` silently starts a stale image whose bundled Alembic
# revisions can be older than the ones already stamped in the database, and
# the backend then crash-loops on "Can't locate revision". Failing loudly on
# a missing variable is the cheaper outcome.
#
# Only nginx publishes ports. Note that Docker writes its own iptables rules
# *ahead* of ufw, so a `ports:` entry here would be reachable from the internet
# no matter what the firewall says — which is exactly why db, backend and
# frontend have none and talk over the internal Compose network instead.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: ${REGISTRY:-ghcr.io/mor8t}/roller-backend:${IMAGE_TAG:?set IMAGE_TAG in .env (e.g. development, or a sha-* tag)}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_HOURS: ${REFRESH_TOKEN_EXPIRE_HOURS:-8}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env (scheme + host, no trailing slash)}
      # Shared with the frontend service below, and with nothing else. Required
      # rather than defaulted for the same reason IMAGE_TAG is: a default would
      # be a publicly known token guarding the preview code. Unset → the route
      # is off and a closed site cannot be previewed at all, which is the
      # failure this should have.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env (openssl rand -hex 32)}
      SQL_ECHO: "false"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${REGISTRY:-ghcr.io/mor8t}/roller-frontend:${IMAGE_TAG:?set IMAGE_TAG in .env (e.g. development, or a sha-* tag)}
    restart: unless-stopped
    environment:
      # Server-to-server calls: Docker's internal DNS, unreachable from a browser.
      BACKEND_API_URL: http://backend:8000
      # What browser <img> src attributes are built from. Absolute on purpose:
      # every component renders admin-uploaded photos with
      # `unoptimized={src.startsWith("http")}`, so next/image's optimizer stays
      # out of the way and no `remotePatterns` entry is needed. Read at runtime,
      # so switching this to https://roller.tj later needs no rebuild.
      BACKEND_PUBLIC_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env (scheme + host, no trailing slash)}
      # The other half of the backend's INTERNAL_API_TOKEN. Read at runtime, so
      # rotating it is an edit in .env plus `up -d` on both services — no
      # rebuild.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env (openssl rand -hex 32)}
    volumes:
      # next/image writes optimized variants here. Without a volume the whole
      # cache is lost on every deploy, and re-encoding AVIF for the product
      # catalogue on 2 vCPUs is the slowest thing this box does.
      - next_image_cache:/app/.next/cache/images
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Restricts the image's envsubst step to our own placeholders. Without
      # this filter it would also expand nginx's $host, $request_uri and the
      # rest into empty strings, silently producing a broken config.
      NGINX_ENVSUBST_FILTER: "^NGINX_SITE_"
      NGINX_SITE_SERVER_NAME: ${NGINX_SITE_SERVER_NAME:-_}
      NGINX_SITE_SSL_CERT: ${NGINX_SITE_SSL_CERT:-/etc/nginx/certs/selfsigned.crt}
      NGINX_SITE_SSL_KEY: ${NGINX_SITE_SSL_KEY:-/etc/nginx/certs/selfsigned.key}
    volumes:
      # conf.d is deliberately NOT mounted: it is where the image writes the
      # rendered template, so it has to stay writable.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - frontend
      - backend

  # Not started by `up -d` — it is a one-off tool, run on demand:
  #
  #   ./scripts/issue-letsencrypt.sh roller.tj you@example.com   # first issue
  #   docker compose -f docker-compose.prod.yml run --rm certbot renew   # cron
  #
  # Uses the webroot challenge rather than standalone so nginx never has to be
  # stopped to renew. Cloudflare passes /.well-known/acme-challenge/ through to
  # the origin, so this works with the proxy on or off.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  postgres_data:
  backend_uploads:
  next_image_cache:
  letsencrypt:
  certbot_webroot:
